name: Quality

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: git diff --check
