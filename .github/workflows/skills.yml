name: Skills

on:
  pull_request:
    paths:
      - 'rockfeller-*/**'
      - 'scripts/validate-skills.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/skills.yml'
  push:
    branches: [main]
    paths:
      - 'rockfeller-*/**'
      - 'scripts/validate-skills.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/skills.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run validate:skills
